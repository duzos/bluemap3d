# Important Notes:
# Every field added here that a mods.toml needs must also be added to the expandProps
# map in buildSrc/src/main/groovy/bluemap3d-common.gradle.
#
# Per-module values (mod_id, mod_name, description, dependencies) live in each module's
# own build.gradle as `ext`, because they differ per artifact.

# Project
version=1.0.0
group=dev.duzo.bluemap3d
java_version=21

# Common
minecraft_version=1.21.1
mod_author=duzo
license=LGPL-3.0-only
credits=
minecraft_version_range=[1.21.1, 1.22)
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# NeoForge
neoforge_version=21.1.247
# The FML loader version range - major version only.
neoforge_loader_version_range=[4,)
# The NeoForge version range, for the `neoforge` mod dependency.
neoforge_version_range=[21.1.0,)

# BlueMap - compiled against the API, never bundled. The surface we use
# (BlueMapAPI/WebApp/AssetStorage/BlueMapMap/BlueMapWorld) is present in the
# API that BlueMap 5.7 ships, so an older compile target stays runtime-safe.
bluemap_api_version=2.7.8
bluemap_version_range=[5.0,)

# Addon targets
computercraft_version=1.120.0
create_version=6.0.10-280
# Create's maven version carries a build number its mod version does not, and NeoForge
# orders 6.0.10-280 above 6.0.10 - so a dependency range built from create_version refuses
# the very jar it was compiled against. The range is declared separately for that reason.
create_version_range=[6.0,)
sable_version=2.0.3
# Sable bundles sable-companion as a jar-in-jar and depends on it by open range. This is
# the version inside sable_version's jar, so the compile classpath matches the runtime.
sable_companion_version=1.6.0

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# Publishing - comma-separated Minecraft versions this jar is tagged for on Modrinth/CurseForge
publish_game_versions=1.21.1
