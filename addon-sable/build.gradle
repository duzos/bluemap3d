plugins {
    id 'bluemap3d-addon'
    id 'me.modmuss50.mod-publish-plugin'
}

ext {
    mod_id = 'bluemap3d_sable'
    mod_name = 'BlueMap: Aeronautics'
    mod_description = 'Shows Sable ships as real 3D models on your BlueMap. Their blocks live in sub-levels, which is why BlueMap cannot show them otherwise.'
}

dependencies {
    // Sable's API, off RyanHCode's own maven. Compile-only: the addon declares a
    // `required` dependency on sable in its toml, so it is always present at runtime and
    // must never be bundled.
    //
    // Non-transitive. Sable's pom puts Veil at compile scope, but Veil is a client
    // rendering library on a maven of its own that nothing here touches, so taking the
    // graph would only add a repository the build has no other use for.
    compileOnly("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        transitive = false
    }

    // Sable's maths types - Pose3d, BoundingBox3i - live in sable-companion, which Sable
    // ships as a jar-in-jar and the loader unpacks at runtime. Pinned to the version
    // inside the jar above rather than taken from Sable's `[1.6.0,)` range, so what this
    // compiles against is the same code that will be unpacked underneath it.
    compileOnly "dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}"

    // The real mod, for the dev server. The published jar, jar-in-jars and all, which is
    // what the loader wants - and what makes :addon-sable:runServer a genuine test
    // rather than a mock.
    devMods "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = providers.fileContents(project.layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    // Driven by the shared publish workflow. When true nothing is uploaded and
    // the release assets are written to the build directory instead.
    dryRun = providers.environmentVariable("PUBLISH_DRY_RUN").map { it == "true" }.getOrElse(false)
    version = "${project.version}-${minecraft_version}"
    displayName = "BlueMap: Aeronautics ${project.version} (${minecraft_version} NeoForge)"
    modLoaders.add("neoforge")

    def mcVersions = project.publish_game_versions.split(",").collect { it.trim() }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "owyPt6vs"
        minecraftVersions.addAll(mcVersions)
        requires { slug = "bluemap3d" }
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = "1685147"
        projectSlug = "bluemap-aeronautics"
        minecraftVersions.addAll(mcVersions)
        clientRequired = false
        serverRequired = true
    }
}
