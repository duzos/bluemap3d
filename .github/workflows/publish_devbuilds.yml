name: Automated dev builds

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - 'ver/**'
      - 'feat/**'

jobs:
  devbuild:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: ./gradlew build

      - name: Publish artifacts
        uses: drtheodor/discord-webhook-upload-action@v0.2
        with:
          url: ${{ secrets.DEV_BUILDS }}
          username: NEOFORGE builds
          avatar: 'https://wiki.tf2classic.com/w/images/b/b3/Engineer_BLU.png'
          message_commit: '> :sparkles: [${commitMessage}](<${commitUrl}>) by [${authorName}](<${authorUrl}>)'
          message_header: |
            <:new1:1253371736510959636><:new2:1253371805734015006> New `${{ github.repository }}` dev build `#${{ github.run_number }}`:
          file: |
            core/build/libs/*.jar
            addon-turtles/build/libs/*.jar
            addon-sable/build/libs/*.jar
            addon-create/build/libs/*.jar
            !**/*-sources.jar
            !**/*-javadoc.jar
            !dev-harness/**
