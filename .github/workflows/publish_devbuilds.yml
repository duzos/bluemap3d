name: Automated dev builds

on:
  # Push only. The message is built from the pushed commit, so a manual
  # dispatch has nothing to read.
  push:
    branches:
      - master
      - 'ver/**'
      - 'feat/**'

jobs:
  devbuild:
    uses: duzos/mod-ci/.github/workflows/devbuild.yml@v1
    secrets: inherit
    with:
      targets: '[{"project":"core"},{"project":"addon-turtles"},{"project":"addon-sable"},{"project":"addon-create"}]'
      java: '21'
