name: Publish (Modrinth + CurseForge)

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'JSON array of {project} objects to publish'
        required: false
        default: '[{"project":"core"},{"project":"addon-turtles"},{"project":"addon-sable"},{"project":"addon-create"}]'
      dry_run:
        description: 'Upload nothing, just prove the build and config'
        type: boolean
        default: false
  release:
    types: [ published ]

jobs:
  publish:
    uses: duzos/mod-ci/.github/workflows/publish.yml@v1
    secrets: inherit
    with:
      targets: ${{ inputs.targets || '[{"project":"core"},{"project":"addon-turtles"},{"project":"addon-sable"},{"project":"addon-create"}]' }}
      java: '21'
      task: 'publishMods'
      dry_run: ${{ inputs.dry_run || false }}
