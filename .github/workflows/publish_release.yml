name: Publish (Modrinth + CurseForge)

on:
  workflow_dispatch:
    inputs:
      modules:
        description: 'JSON array of modules to publish'
        required: false
        default: '["core","addon-turtles","addon-sable","addon-create"]'
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Sequential, so a failure part-way through does not leave some artifacts
      # published against a version the others never reached.
      max-parallel: 1
      fail-fast: true
      matrix:
        # Driven by the dispatch input so a module already published at this version
        # can be skipped; a release event sends no input and gets all four.
        module: ${{ fromJSON(inputs.modules || '["core","addon-turtles","addon-sable","addon-create"]') }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build ${{ matrix.module }}
        run: ./gradlew -p ${{ matrix.module }} build

      - name: Publish ${{ matrix.module }} (Modrinth + CurseForge + Discord)
        run: ./gradlew :${{ matrix.module }}:publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
