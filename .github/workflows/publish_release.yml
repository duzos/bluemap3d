name: Publish (Modrinth + CurseForge)

on:
  workflow_dispatch:
  release:
    types: [ published ]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # Sequential, so a failure part-way through does not leave some artifacts
      # published against a version the others never reached.
      max-parallel: 1
      fail-fast: true
      matrix:
        module: [ core, addon-turtles, addon-sable, addon-create ]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build ${{ matrix.module }}
        run: ./gradlew -p ${{ matrix.module }} build

      - name: Publish ${{ matrix.module }} (Modrinth + CurseForge + Discord)
        run: ./gradlew :${{ matrix.module }}:publishMods
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          CURSEFORGE_PROJECT_BLUEMAP3D: ${{ secrets.CURSEFORGE_PROJECT_BLUEMAP3D }}
          CURSEFORGE_PROJECT_TURTLES: ${{ secrets.CURSEFORGE_PROJECT_TURTLES }}
          CURSEFORGE_PROJECT_SABLE: ${{ secrets.CURSEFORGE_PROJECT_SABLE }}
          CURSEFORGE_PROJECT_CREATE: ${{ secrets.CURSEFORGE_PROJECT_CREATE }}

  bundle:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      # The bundle is the interim single-jar distribution: core with the three addons
      # nested. Attached to the GitHub release rather than published to the mod sites,
      # which carry the four artifacts separately.
      - name: Build bundle jar
        run: ./gradlew bundleJar

      - name: Attach bundle to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/bluemap3d-bundle-*.jar
