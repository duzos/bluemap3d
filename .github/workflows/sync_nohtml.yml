name: Sync README_nohtml.md

# Regenerates each module's README_nohtml.md (pure markdown for CurseForge) from
# its README.md. CurseForge's editor takes markdown only, so this lowers the HTML
# in every README.md to plain markdown and commits the results back to master.

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - core/README.md
      - addon-create/README.md
      - addon-sable/README.md
      - addon-turtles/README.md
      - .github/scripts/readme_to_markdown.py

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate README_nohtml.md for each module
        run: |
          set -euo pipefail
          # One entry per module. Add a fifth by adding one line here; the commit
          # step below picks it up automatically.
          modules=(core addon-create addon-sable addon-turtles)
          for m in "${modules[@]}"; do
            python3 .github/scripts/readme_to_markdown.py "$m/README.md" "$m/README_nohtml.md" "$m"
          done

      - name: Commit if changed
        run: |
          set -euo pipefail
          modules=(core addon-create addon-sable addon-turtles)
          paths=()
          for m in "${modules[@]}"; do
            paths+=("$m/README_nohtml.md")
          done

          if git diff --quiet -- "${paths[@]}"; then
            echo "README_nohtml.md files already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${paths[@]}"
          git commit -m "docs: regenerate README_nohtml.md"
          git push
