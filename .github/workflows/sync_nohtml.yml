name: Sync README_nohtml.md

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - core/README.md
      - addon-create/README.md
      - addon-sable/README.md
      - addon-turtles/README.md

jobs:
  nohtml:
    uses: duzos/mod-ci/.github/workflows/sync-nohtml.yml@v1
    permissions:
      contents: write
    with:
      modules: '["core","addon-create","addon-sable","addon-turtles"]'
