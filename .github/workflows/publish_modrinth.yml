name: Publish (Modrinth)

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module to publish'
        required: true
        default: 'core'
        type: choice
        options:
          - core
          - addon-turtles
          - addon-sable
          - addon-create

jobs:
  modrinth:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build ${{ inputs.module }}
        run: ./gradlew -p ${{ inputs.module }} build

      - name: Publish ${{ inputs.module }} to Modrinth
        run: ./gradlew :${{ inputs.module }}:publishModrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT_BLUEMAP3D: ${{ secrets.MODRINTH_PROJECT_BLUEMAP3D }}
          MODRINTH_PROJECT_TURTLES: ${{ secrets.MODRINTH_PROJECT_TURTLES }}
          MODRINTH_PROJECT_SABLE: ${{ secrets.MODRINTH_PROJECT_SABLE }}
          MODRINTH_PROJECT_CREATE: ${{ secrets.MODRINTH_PROJECT_CREATE }}
