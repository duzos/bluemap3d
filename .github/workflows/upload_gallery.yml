name: Sync gallery (Modrinth)

# Syncs each module's Modrinth gallery to match <module>/gallery/ + <module>/gallery.json.
# The existing gallery entries are cleared first, then every image in <module>/gallery/
# is uploaded; <module>/gallery.json optionally adds a title / description / featured
# flag / ordering per filename. Clearing before uploading keeps re-runs safe -
# Modrinth rejects re-uploading an unchanged image as a duplicate, so the old
# copies have to go before the new ones land. The gallery always ends up matching
# <module>/gallery/ exactly - adding, replacing and removing images all just work.
#
# Gallery source lives at <module>/gallery/ + <module>/gallery.json rather than the
# existing <module>/img/ + README.md pairing: img/ holds README illustration assets
# (a shared logo, a demo gif, upgrade screenshots) that would be wrong to publish as
# gallery entries, so the gallery gets its own directory per module.
#
# No module has a gallery yet, so <module>/gallery/ is absent for all four right now.
# An absent or empty gallery directory is a clean skip for that project, not a
# failure - this workflow must keep working for modules that haven't added images.
# To add a gallery for a module: create <module>/gallery/, drop images in, optionally
# add entries to <module>/gallery.json (see the "_comment" key in that file for the
# format once one exists), then run this workflow.
#
# Runs manually, or on a push to master whose commit message contains [deploy].
# Requires the MODRINTH_TOKEN secret, which is not yet set on this repo - this
# workflow cannot run for real until someone adds it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be deleted and uploaded, call no mutating endpoint'
        type: boolean
        default: true
  push:
    branches: [master]
    paths:
      - core/gallery.json
      - core/gallery/**
      - addon-create/gallery.json
      - addon-create/gallery/**
      - addon-sable/gallery.json
      - addon-sable/gallery/**
      - addon-turtles/gallery.json
      - addon-turtles/gallery/**

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # One entry per Modrinth project. Add a module here and it is done, nothing
        # else in this workflow needs to change.
        project:
          - id: 6qumn46W
            dir: core
          - id: rxpPQGD1
            dir: addon-create
          - id: owyPt6vs
            dir: addon-sable
          - id: uWqMFrYC
            dir: addon-turtles
    steps:
      - uses: actions/checkout@v4

      - name: Sync ${{ matrix.project.dir }}/gallery to the Modrinth gallery
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PID: ${{ matrix.project.id }}
          MODULE_DIR: ${{ matrix.project.dir }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          API=https://api.modrinth.com/v2
          GALLERY_DIR="$MODULE_DIR/gallery"
          MANIFEST="$MODULE_DIR/gallery.json"
          [ -f "$MANIFEST" ] || MANIFEST=

          content_type() {
            case "$1" in
              png) echo image/png ;;
              jpg|jpeg) echo image/jpeg ;;
              webp) echo image/webp ;;
              gif) echo image/gif ;;
              *) echo application/octet-stream ;;
            esac
          }

          meta() { # meta <filename> <jq-filter> <default>
            local v=""
            if [ -n "$MANIFEST" ]; then
              v=$(jq -r --arg n "$1" "(.[\$n] // {}) | $2 // empty" "$MANIFEST" 2>/dev/null || true)
            fi
            [ -n "$v" ] && echo "$v" || echo "$3"
          }

          # No gallery yet for this module: a clean skip, not a failure. Every module
          # starts with no gallery directory, so this is the common case for now.
          shopt -s nullglob
          files=("$GALLERY_DIR"/*.png "$GALLERY_DIR"/*.jpg "$GALLERY_DIR"/*.jpeg "$GALLERY_DIR"/*.webp "$GALLERY_DIR"/*.gif)
          if [ ! -d "$GALLERY_DIR" ] || [ ${#files[@]} -eq 0 ]; then
            echo "No gallery for $MODULE_DIR ($GALLERY_DIR absent or empty), skipping."
            exit 0
          fi

          # 1. Clear the current gallery first. Modrinth dedupes by image content,
          #    so an unchanged image can't be re-uploaded while its old copy is still there.
          existing=$(curl -fsSL "$API/project/$PID" | jq -r '.gallery[]?.url')
          if [ -n "$existing" ]; then
            while IFS= read -r u; do
              [ -z "$u" ] && continue
              if [ "$DRY_RUN" = "true" ]; then
                echo "[dry run] would delete $u"
                continue
              fi
              eu=$(jq -rn --arg v "$u" '$v|@uri')
              code=$(curl -sS -o /dev/null -w '%{http_code}' -X DELETE "$API/project/$PID/gallery?url=$eu" \
                -H "Authorization: $MODRINTH_TOKEN")
              echo "Removed old entry (HTTP $code)"
            done <<< "$existing"
          fi

          # 2. Upload every image in <module>/gallery/, ordered by the manifest's "ordering".
          # sort files by ordering (manifest) then name
          sorted=$(for f in "${files[@]}"; do
            n=$(basename "$f"); echo "$(meta "$n" '.ordering' 9999)|$f"
          done | sort -t'|' -k1,1n -k2 | cut -d'|' -f2-)

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            name=$(basename "$file")
            ext="${name##*.}"; ext="${ext,,}"
            title=$(meta "$name" '.title' "${name%.*}")
            desc=$(meta "$name" '.description' "")
            featured=$(meta "$name" '.featured' "false")
            ordering=$(meta "$name" '.ordering' "0")

            if [ "$DRY_RUN" = "true" ]; then
              echo "[dry run] would upload $name (title=\"$title\", description=\"$desc\", featured=$featured, ordering=$ordering)"
              continue
            fi

            etitle=$(jq -rn --arg v "$title" '$v|@uri')
            qurl="$API/project/$PID/gallery?ext=$ext&featured=$featured&title=$etitle&ordering=$ordering"
            # Modrinth rejects an empty description, so only send the param when set.
            if [ -n "$desc" ]; then
              edesc=$(jq -rn --arg v "$desc" '$v|@uri')
              qurl="$qurl&description=$edesc"
            fi
            echo "Uploading $name (title=\"$title\", featured=$featured, ordering=$ordering)"
            code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$qurl" \
              -H "Authorization: $MODRINTH_TOKEN" \
              -H "Content-Type: $(content_type "$ext")" \
              --data-binary "@$file")
            echo "  HTTP $code"
            if [ "$code" != "204" ]; then echo "  $(cat resp.txt)"; echo "::error::upload failed for $name"; exit 1; fi
          done <<< "$sorted"

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run complete for $MODULE_DIR, nothing was deleted or uploaded."
          else
            echo "Gallery sync complete for $MODULE_DIR."
          fi
