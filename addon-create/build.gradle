plugins {
    id 'bluemap3d-addon'
    id 'me.modmuss50.mod-publish-plugin'
}

ext {
    mod_id = 'bluemap3d_create'
    mod_name = 'BlueMap3D: Trains'
    mod_description = 'Shows Create trains as real 3D models on your BlueMap, one object per carriage.'
}

dependencies {
    // Create's maven pulls a large transitive graph (Registrate, Flywheel, Ponder). The
    // provider is a stub for now, so the dependency is left commented rather than paid
    // for on every build. Uncomment when implementing it.
    //
    // compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    // compileOnly "com.tterrag.registrate:Registrate:MC${minecraft_version}-..."
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = providers.fileContents(rootProject.layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    version = "${project.version}-${minecraft_version}"
    displayName = "BlueMap3D: Trains ${project.version} (${minecraft_version} NeoForge)"
    modLoaders.add("neoforge")

    def mcVersions = project.publish_game_versions.split(",").collect { it.trim() }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = providers.environmentVariable("MODRINTH_PROJECT_CREATE")
        minecraftVersions.addAll(mcVersions)
        requires { slug = "bluemap3d" }
        requires { slug = "create" }
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_CREATE")
        projectSlug = "bluemap3d-trains"
        minecraftVersions.addAll(mcVersions)
        clientRequired = false
        serverRequired = true
    }
}
