plugins {
    id 'bluemap3d-addon'
    id 'me.modmuss50.mod-publish-plugin'
}

ext {
    mod_id = 'bluemap3d_create'
    mod_name = 'BlueMap: Create'
    mod_description = 'Shows Create trains and moving contraptions as real 3D models on your BlueMap - carriages, bearings, gantries, pistons and minecart contraptions.'
}

dependencies {
    // Create's API. Compile-only: the addon declares a `required` dependency on create in
    // its toml, so it is always present at runtime and must never be bundled.
    //
    // The `slim` classifier is the one to compile against. It is the same Create classes
    // as the main jar minus the jar-in-jars it ships (Registrate, Ponder) - and since
    // every dependency in Create's published pom is runtime-scoped, a compileOnly
    // dependency resolves to this one file and nothing else.
    compileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"

    // TrackCurves reaches Create.RAILWAYS for the curved-track discovery task, and the
    // Create class itself references CreateRegistrate (its registrate() method's return
    // type) - so touching Create.RAILWAYS pulls Registrate types onto the compile
    // classpath even though nothing here calls Registrate directly. Compile-only, same as
    // Create itself: Registrate is bundled inside Create's own jar at runtime, so it must
    // never be added to devMods or bundled here.
    compileOnly "com.tterrag.registrate:Registrate:MC1.21-1.3.0+67"

    // CurvedTrackProvider needs net.createmod.catnip.data.Couple, the type
    // BezierConnection.bePositions is declared with. Couple is not in the slim jar - it
    // lives in Create's bundled ponder jar-in-jar - but ponder is also published on
    // Create's own maven, so it can be compiled against directly here. Compile-only for
    // the same reason as Create and Registrate above: Create unpacks ponder from its own
    // jar-in-jar at runtime, so it must never go into devMods or get bundled.
    compileOnly "net.createmod.ponder:ponder-neoforge:1.0.82+mc1.21.1"

    // The real mod, for the dev server - the main jar rather than slim, because this one
    // has to actually run and the loader needs the jar-in-jars unpacked. Create declares
    // no external mod dependencies on 1.21.1; everything it needs is inside.
    devMods "com.simibubi.create:create-${minecraft_version}:${create_version}"

    // Steam 'n' Rails publishes no maven the addon can compile against, and does not need
    // to: BogeyStyles consumes nothing but strings (block ids, style ids, model paths),
    // so there is no compileOnly dependency to add - see BogeyStyles' own class comment.
    // The jar in libs/ (addon-sable's pattern) exists purely to make it installed on the
    // dev server, so railways bogeys are actually there to render against. Builds fine
    // with libs/ empty; it just means nothing to test against.
    def railwaysJar = file("libs/railways-0.2.1+neoforge-mc1.21.1.jar")
    if (railwaysJar.exists()) {
        devMods files(railwaysJar)
        logger.lifecycle("addon-create: installing ${railwaysJar.name} on the dev server")
    } else {
        logger.lifecycle("addon-create: ${railwaysJar.name} not in libs/, dev server will not have Steam 'n' Rails")
    }
}

publishMods {
    file = tasks.named('jar', Jar).flatMap { it.archiveFile }
    changelog = providers.fileContents(project.layout.projectDirectory.file("CHANGELOG.md")).asText
    type = STABLE
    version = "${project.version}-${minecraft_version}"
    displayName = "BlueMap: Create ${project.version} (${minecraft_version} NeoForge)"
    modLoaders.add("neoforge")

    def mcVersions = project.publish_game_versions.split(",").collect { it.trim() }

    modrinth {
        accessToken = providers.environmentVariable("MODRINTH_TOKEN")
        projectId = "rxpPQGD1"
        minecraftVersions.addAll(mcVersions)
        requires { slug = "bluemap3d" }
        requires { slug = "create" }
    }
    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = providers.environmentVariable("CURSEFORGE_PROJECT_CREATE")
        projectSlug = "bluemap3d-trains"
        minecraftVersions.addAll(mcVersions)
        clientRequired = false
        serverRequired = true
    }
}
